name: Lunar Wolf Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Zagetsus
          filename: assets/metrics/github-stats.svg

          template: classic
          base: header
          config_timezone: America/Sao_Paulo

          extras_css: |
            body {
              background: #0A0A0C !important;
              color: #F2F0ED !important;
            }

            h1, h2, h3,
            .field,
            .field > span,
            text {
              color: #F2F0ED !important;
              fill: #F2F0ED !important;
            }

            a {
              color: #C1121F !important;
            }

      - name: Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Zagetsus
          filename: assets/metrics/languages.svg

          template: classic
          base: ""

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          extras_css: |
            body {
              background: #0A0A0C !important;
              color: #F2F0ED !important;
            }

            h1, h2, h3,
            .field,
            .field > span,
            text {
              color: #F2F0ED !important;
              fill: #F2F0ED !important;
            }

            a {
              color: #C1121F !important;
            }

      - name: Contribution Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Zagetsus
          filename: assets/metrics/contributions.svg

          template: classic
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          extras_css: |
            body {
              background: #0A0A0C !important;
              color: #F2F0ED !important;
            }

            h1, h2, h3,
            .field,
            .field > span,
            text {
              color: #F2F0ED !important;
              fill: #F2F0ED !important;
            }

            a {
              color: #C1121F !important;
            }

            rect[fill="#ebedf0"] {
              fill: #18181C !important;
            }

            rect[fill="#9be9a8"] {
              fill: #720E17 !important;
            }

            rect[fill="#40c463"] {
              fill: #920F1A !important;
            }

            rect[fill="#30a14e"] {
              fill: #C1121F !important;
            }

            rect[fill="#216e39"] {
              fill: #E21D2D !important;
            }